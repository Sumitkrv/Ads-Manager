project_id = "tandem-ads-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5180"
additional_redirect_urls = [
  "http://127.0.0.1:5180/login",
  "http://127.0.0.1:5180/reset-password",
  "http://localhost:5180/login",
  "http://localhost:5180/reset-password"
]

[auth.email]
enable_signup = true
enable_confirmations = true
